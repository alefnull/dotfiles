backend = "resized"
color_space = "lchmixed" # idc about this one..
palette = "dark16"
check_contrast = true
threshold = 11

[templates]
waybar = { src = "waybar-colors.css", dst = "~/.config/waybar/colors.css" }
hyprland = { src = "hyprland.conf", dst = "~/.config/hypr/config/wallust-colors.conf" }
wofi = { src = "waybar-colors.css", dst = "~/.config/wofi/colors.css" }
vscode = { src = 'vscode.json', dst = '~/.cache/wallust/colors.json' }
vscode2 = { src = 'vscode', dst = '~/.cache/wallust/colors' }
neopywal = { src = 'colors_neopywal.vim', dst = '~/.cache/wallust/colors_neopywal.vim' }
wlogout = { src = 'waybar-colors.css', dst = '~/.config/wlogout/colors.css' }
vencord = { src = 'discord-colors.css', dst = '~/.cache/wallust/discord-colors.css' }
spicetify = { src = 'spicetify-colors.ini', dst = '~/.config/spicetify/Themes/text/color.ini' }
spicetify2 = { src = 'spicetify-colors.ini', dst = '~/.config/spicetify/Themes/nightlight/color.ini' }
qutebrowser = { src = 'qute_colors.py', dst = '~/.config/qutebrowser/qute_colors.py' }
ghostty = { src = 'ghostty-colors', dst = '~/.config/ghostty/themes/wallust' }
themecord = { src = 'colors-discord.css', dst = '~/.cache/wallust/colors-discord.css' }

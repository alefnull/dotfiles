# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Windows Rules https://wiki.hyprland.org/0.45.0/Configuring/Window-Rules/ #

# Float Necessary Windows
windowrule = float on, size 960 480, center on, match:class ^(org.pulseaudio.pavucontrol)
windowrule = float on, match:class ^()$, match:title ^(Picture in picture)$
windowrule = float on, size 1200 800, center on, match:class ^()$, match:title ^(Save File)$
windowrule = float on, size 1200 800, center on, match:class ^()$, match:title ^(Open File)$
windowrule = float on, size 1200 800, center on, match:class ^(blender)$, match:title ^(Blender File View)$
windowrule = float on, size 1920 1080, center on, match:class ^(blender)$, match:title ^(Blender Render)$
windowrule = float on, center on, match:class ^(LibreWolf)$, match:title ^(Picture-in-Picture)$
windowrule = float on, center on, match:class ^(blueman-manager)$
windowrule = float on, center on, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrule = float on, center on, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrule = float on, center on, match:class ^(CachyOSHello)$
windowrule = float on, center on, match:class ^(zenity)$
windowrule = float on, center on, match:class ^()$, match:title ^(Steam - Self Updater)$
windowrule = float on, size 1200 800, center on, match:class ^(waypaper)$
windowrule = float on, size 960 480, center on, match:class ^(qt-sudo)$
windowrule = float on, center on, match:class ^(swayimg)$
windowrule = float on, center on, match:class (clipse) # ensure you have a floating window class set if you want this behavior
windowrule = size 1200 600, match:class (clipse) # set the size of the window as necessary
# Increase the opacity
# windowrule = opacity 0.92, match:class ^(thunar|nemo)$
# windowrule = opacity 0.96, class:^(discord|armcord|webcord)$
# windowrule = opacity 0.95, match:title ^(QQ|Telegram)$
# windowrule = opacity 0.95, match:title ^(NetEase Cloud Music Gtk4)$
# windowrule = opacity 0.95, match:class ^(code-oss)$
# windowrule = opacity 0.90, match:class ^(kitty)$
# windowrule = opacity 0.90, match:class ^(obsidian)$
# General window rules
windowrule = float on, pin on, size 960 540, move ((monitor_w*0.25)-), match:title ^(Picture-in-Picture)$
windowrule = float on, move ((monitor_w*0.25)-), size 960 540, match:title ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = pin on, match:title ^(danmufloat)$
windowrule = float on, size 1920 1080, center on, match:title ^(.* — Prism Launcher 9.4)
windowrule = no_blur on, match:class ^(org.mozilla.firefox)$
windowrule = no_initial_focus on, match:class (jetbrains-)(.*), match:float 1
# Decorations related to floating windows on workspaces 1 to 10
#windowrule = bordersize 2, floating:1, onworkspace:w[fv1-10]
#windowrule = bordercolor $color4, floating:1, onworkspace:w[fv1-10]
#windowrule = rounding 0, floating:1, onworkspace:w[fv1-10]
# Decorations related to tiling windows on workspaces 1 to 10
#windowrule = bordersize 3, floating:0, onworkspace:f[1-10]
#windowrule = rounding 0, floating:0, onworkspace:f[1-10]
# Windows Rules End #

# Workspaces Rules https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/ #
# workspace = 1, default:true, monitor:$priMon
# workspace = 6, default:true, monitor:$secMon
# Workspace selectors https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#workspace-selectors
# workspace = r[1-5], monitor:$priMon
# workspace = r[6-10], monitor:$secMon
# workspace = special:scratchpad, on-created-empty:$applauncher
# no_gaps_when_only deprecated instead workspaces rules with selectors can do the same
# Smart gaps from 0.45.0 https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#smart-gaps
#workspace = w[tv1-10], gapsout:5, gapsin:3
#workspace = f[1], gapsout:5, gapsin:3
workspace = special:scratchpad, gapsout:32, gapsin:16, on-created-empty:ghostty
# Workspaces Rules End #

# Layers Rules #
layerrule = animation slide top, match:namespace logout_dialog
# layerrule = animation popin 50%, waybar
layerrule = animation slide down, match:namespace waybar
layerrule = animation fade 50%, match:namespace wallpaper
# Layers Rules End #

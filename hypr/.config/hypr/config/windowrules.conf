# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Windows Rules https://wiki.hyprland.org/0.45.0/Configuring/Window-Rules/ #

# Float Necessary Windows
windowrule = match:class ^(org.pulseaudio.pavucontrol), float on, size 960 480
windowrule = match:title ^(Picture in picture)$, float on
windowrule = match:title ^(Save File)$, float on, size 1200 800
windowrule = match:class ^(zen)$, match:title ^(Save As - .*)$, float on, size 1200 800
windowrule = match:title ^(Open File)$, float on, size 1200 800
windowrule = match:title ^(Blender File View)$, float on, size 1200 800
windowrule = match:title ^(Blender Render)$, float on, size 1920 1080
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$, float on
windowrule = match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$, float on
windowrule = match:title ^(Steam - Self Updater)$, float on
windowrule = match:class ^(waypaper)$, float on, size 1280 880
windowrule = match:class ^(qt-sudo)$, float on, size 960 480
windowrule = match:class ^(swayimg)$, float on
windowrule = match:class (clipse), float on, size 1200 600
# Increase the opacity
# windowrule = opacity 0.92, match:class ^(thunar|nemo|pcmanfm)$
# windowrule = opacity 0.92, match:class ^(discord|armcord|webcord)$
# windowrule = opacity 0.95, match:title ^(QQ|Telegram)$
# windowrule = opacity 0.95, match:title ^(NetEase Cloud Music Gtk4)$
# windowrule = opacity 0.95, match:class ^(code-oss)$
# windowrule = opacity 0.90, match:class ^(kitty)$
# windowrule = opacity 0.90, match:class ^(obsidian)$
# General window rules
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on, size 960 540, move (2560-window_w) (1600-window_h)
windowrule = match:title ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$, float on, move ((monitor_w*0.25) -), size 960 540
windowrule = match:title ^(danmufloat)$, pin on
windowrule = match:title ^(.* — Prism Launcher 9.4), float on, size 1920 1080
windowrule = match:class ^(org.mozilla.firefox)$, no_blur on
# Decorations related to floating windows on workspaces 1 to 10
#windowrule = bordersize 2, floating:1, onworkspace:w[fv1-10]
#windowrule = bordercolor $color4, floating:1, onworkspace:w[fv1-10]
#windowrule = rounding 0, floating:1, onworkspace:w[fv1-10]
# Decorations related to tiling windows on workspaces 1 to 10
#windowrule = bordersize 3, floating:0, onworkspace:f[1-10]
#windowrule = rounding 0, floating:0, onworkspace:f[1-10]
# Windows Rules End #

# Workspaces Rules https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/ #
# workspace = 1, default:true, monitor:$priMon
# workspace = 6, default:true, monitor:$secMon
# Workspace selectors https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#workspace-selectors
# workspace = r[1-5], monitor:$priMon
# workspace = r[6-10], monitor:$secMon
# workspace = special:scratchpad, on-created-empty:$applauncher
# no_gaps_when_only deprecated instead workspaces rules with selectors can do the same
# Smart gaps from 0.45.0 https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#smart-gaps
#workspace = w[tv1-10], gapsout:5, gapsin:3
#workspace = f[1], gapsout:5, gapsin:3
workspace = special:scratchpad, gapsout:0, gapsin:0, on-created-empty:$terminal
# Workspaces Rules End #

# Layers Rules #
layerrule = match:namespace logout_dialog, animation slide top
# layerrule = animation popin 50%, waybar
layerrule = match:namespace waybar, animation slide down
layerrule = match:namespace wallpaper, animation fade 50%
# Layers Rules End #
